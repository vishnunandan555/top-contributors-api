<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Contributors API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e6edf3;
    }

    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #161b22;
      max-width: 420px;
      width: 90%;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: #e6edf3;
    }

    p {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    a.btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      background: #238636;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    a.btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Top Contributors API</h1>
    <p>Returns GitHub contributors as an embeddable SVG.</p>
    <a class="btn" href="/api/contributors">Go to API →</a>
  </div>
</body>
</html>
